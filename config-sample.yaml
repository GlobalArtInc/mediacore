port: 7880
bind_addresses:
  - 0.0.0.0

log_level: info

keys:
  devkey: devsecretdevsecretdevsecretdevsecret

room:
  # With auto_create off, a room has to be created before anybody can join it,
  # which is what makes it possible for only the rooms an operator knows about
  # to exist. A room created that way carries its own settings and outlives the
  # last person to leave it; a room that only exists because somebody walked in
  # is closed as soon as they walk out.
  auto_create: true

  # How long a created room is kept with nobody in it: empty_timeout before
  # anybody has ever joined it, departure_timeout after the last person leaves.
  # These only apply to rooms somebody created -- one that exists because an
  # arrival opened it is gone the moment they walk out, which is a departure
  # timeout of zero. Either at 0 means such a room is never collected and
  # DeleteRoom is the only way to be rid of it, which for a service that makes
  # a room per meeting means the room list grows for as long as the process
  # lives. A room counting down to the end of its session is not idle and is
  # left to end when it said it would.
  empty_timeout: 300
  departure_timeout: 20
  max_participants: 0

  # The room ends when fewer than min_humans people are left in it, end_grace
  # seconds after the one who left. Somebody arriving inside that window calls
  # it off. A recorder or an agent is not a person: those are told apart by the
  # recorder and agent grants in a token, or its kind claim, and a room of them
  # ends on schedule. Off at min_humans: 0, which is what every room does today
  # — emptiness is the only thing that ends one. These two are the default for
  # every room; a room can carry a policy of its own in its metadata, under a
  # sessionPolicy key, which is how one reaches CreateRoom through an
  # unmodified LiveKit server SDK. See "Server API" in the README.
  min_humans: 0
  end_grace: 90

  # What happens when an identity that is already in the room joins again.
  # suffix gives the new connection an identity of its own -- alice, alice#2,
  # alice#3 -- keeps the display name, and tells the client which one it got in
  # the JoinResponse, so one person can be in a room from a laptop and a phone
  # at once. displace throws the earlier session out, which is what LiveKit
  # does. A client that reconnects naming the session it had takes that session
  # back under either rule rather than becoming a second person.
  duplicate_identity: suffix

  # How often the server looks at rooms nobody is doing anything to. It is the
  # only clock the room registry has: a session policy running out and an empty
  # room being collected both happen here, and both would otherwise wait for
  # somebody to open a signalling session and drive them. Whole seconds are
  # what the policy and the timeouts are counted in, so a second is enough.
  sweep_interval_ms: 1000

twirp:
  # The room API is mediacore.RoomService, so its own path is
  # /twirp/mediacore.RoomService/<Method>. LiveKit's server SDKs and lk do not
  # take a path: they build it in generated code from the package their own
  # .proto declares, which is livekit.RoomService. This also answers there.
  #
  # It is the same handler -- same methods, same grants, same error bodies --
  # so leaving it on costs nothing. Turning it off does not refuse those calls
  # politely: the route stops existing, and a LiveKit SDK gets a bare 404 with
  # no Twirp code in it and reports a transport failure. Turn it off when
  # nothing built against LiveKit calls this server any more.
  livekit_alias: true

rtc:
  udp_port: 7882
  port_range_start: 50000
  port_range_end: 60000
  bind_address: 0.0.0.0
  advertise_addresses: []
  use_socket_address: true
  use_external_ip: false
  node_ip: ""
  ice_disconnected_timeout: 20

video:
  dynacast_pause_delay_ms: 5000
  layer_upgrade_hold_ms: 2000

  # Bandwidth estimation, allocation and pacing, off by default. Turning it on
  # gives every subscriber transport str0m's congestion estimator and its leaky
  # bucket pacer, and gives the server a budget to spend across that
  # subscriber's video tracks. Publisher transports are never given either.
  bwe:
    enabled: false

    # What the estimator starts from before any feedback has arrived, and what
    # the allocator is allowed to spend over that same window, so a subscriber
    # joining a slow link is never handed everything. max_desired_kbps is the
    # ceiling on what the server ever asks the prober to aim for.
    initial_kbps: 600
    max_desired_kbps: 10000

    # A committed budget never falls below this. Below it there is no video
    # worth sending and the answer is to pause instead.
    min_budget_kbps: 150

    # Taken off the top for every audio subscription before video is allocated.
    # The floor matters: a track whose owner is silent measures near zero and
    # must still book the room it needs the moment they speak.
    audio_reserve_kbps: 48

    # false overruns the budget rather than blanking a subscriber's video,
    # which is also the reference's default. true lets the allocator pause the
    # lowest priority tracks instead, and the subscriber is told with
    # StreamStateUpdate when it does.
    allow_pause: false

    # How far past the budget allow_pause: false is allowed to go before it
    # pauses the lowest priority tracks anyway. Without a bound, refusing to
    # pause turns over-subscription into two seconds of pacer queue and leaves
    # the allocator with no move. The highest priority track always keeps its
    # base rung whatever this says.
    max_overrun_percent: 150

    # Bytes per packet added to a measured payload rate to price a layer as it
    # costs on the wire. Calibrated per subscriber at runtime from what str0m
    # reports; this is only the starting point.
    overhead_bytes: 40

    # How often the budget is spent across the tracks a subscriber receives.
    allocation_interval_ms: 250

    # Recovery is deliberately slower than reaction. A track is raised only
    # after the link has been clear for recovery_hold_ms, at most one track per
    # tick, and no track twice inside recovery_step_ms. Going down waits for
    # nothing.
    recovery_hold_ms: 2000
    recovery_step_ms: 1000

    # How long a packet may sit unsent in the pacer's queue before that counts
    # as congestion on its own. This is the signal that catches the failure
    # pacing introduces: over-subscription becomes latency, not loss.
    queue_pressure_ms: 150
