port: 7880
bind_addresses:
  - 0.0.0.0

log_level: info

keys:
  devkey: devsecretdevsecretdevsecretdevsecret

room:
  auto_create: true
  empty_timeout: 300
  departure_timeout: 20
  max_participants: 0

rtc:
  udp_port: 7882
  port_range_start: 50000
  port_range_end: 60000
  bind_address: 0.0.0.0
  advertise_addresses: []
  use_socket_address: true
  use_external_ip: false
  node_ip: ""
  ice_disconnected_timeout: 20

video:
  dynacast_pause_delay_ms: 5000
  layer_upgrade_hold_ms: 2000
