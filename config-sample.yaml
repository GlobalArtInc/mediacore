port: 7880
bind_addresses:
  - 0.0.0.0

log_level: info

keys:
  devkey: devsecretdevsecretdevsecretdevsecret

room:
  # With auto_create off, a room has to be created before anybody can join it,
  # which is what makes it possible for only the rooms an operator knows about
  # to exist. A room created that way carries its own settings and outlives the
  # last person to leave it; a room that only exists because somebody walked in
  # is closed as soon as they walk out.
  auto_create: true

  # How long a created room is kept with nobody in it: empty_timeout before
  # anybody has ever joined it, departure_timeout after the last person leaves.
  # These only apply to rooms somebody created -- one that exists because an
  # arrival opened it is gone the moment they walk out, which is a departure
  # timeout of zero. Either at 0 means such a room is never collected and
  # DeleteRoom is the only way to be rid of it, which for a service that makes
  # a room per meeting means the room list grows for as long as the process
  # lives. A room counting down to the end of its session is not idle and is
  # left to end when it said it would.
  empty_timeout: 300
  departure_timeout: 20
  max_participants: 0

  # The room ends when fewer than min_humans people are left in it, end_grace
  # seconds after the one who left. Somebody arriving inside that window calls
  # it off. A recorder or an agent is not a person: those are told apart by the
  # recorder and agent grants in a token, or its kind claim, and a room of them
  # ends on schedule. Off at min_humans: 0, which is what every room does today
  # — emptiness is the only thing that ends one. These two are the default for
  # every room; a room can carry a policy of its own in its metadata, under a
  # sessionPolicy key, which is how one reaches CreateRoom through an
  # unmodified LiveKit server SDK. See "Server API" in the README.
  min_humans: 0
  end_grace: 90

  # What happens when an identity that is already in the room joins again.
  # suffix gives the new connection an identity of its own -- alice, alice#2,
  # alice#3 -- keeps the display name, and tells the client which one it got in
  # the JoinResponse, so one person can be in a room from a laptop and a phone
  # at once. displace throws the earlier session out, which is what LiveKit
  # does. A client that reconnects naming the session it had takes that session
  # back under either rule rather than becoming a second person.
  duplicate_identity: suffix

  # How often the server looks at rooms nobody is doing anything to. It is the
  # only clock the room registry has: a session policy running out and an empty
  # room being collected both happen here, and both would otherwise wait for
  # somebody to open a signalling session and drive them. Whole seconds are
  # what the policy and the timeouts are counted in, so a second is enough.
  sweep_interval_ms: 1000

sessions:
  # Where the record of every meeting is kept. A meeting is one stretch of a
  # room being occupied, and a room holds many of them one after another, so
  # the record outlives the room — including a room that only ever existed
  # because somebody walked into it and went away with them. Read back at
  # /api/rooms/<room>/sessions, /api/rooms/<room>/session and
  # /api/sessions/<id>.
  #
  # There is no setting that turns this off. Records are written as the meeting
  # goes on rather than emitted when it ends, because a consumer that was down
  # at half past six has to be able to come back and ask what it missed.
  #
  # WHICH STORE. Naming a database in postgres.url below selects it; leaving it
  # empty leaves this server on the directory of files. One setting rather than
  # a switch beside a url, because a switch and a url can disagree and there is
  # no version of that mistake worth being able to make.
  #
  # A deployment running MORE THAN ONE server process has to name a database.
  # Three processes cannot share a directory: each holds its own index of it,
  # they overwrite each other's records, and a node that dies takes its
  # unfinished meetings out of reach of the ones still up. So does a deployment
  # that wants RECORDINGS, whose upload queue is a thing several processes poll
  # and which a directory therefore refuses to be.

  # One JSON file per meeting, named by its session id, when no database is
  # named. Created at start, and the server refuses to start if it cannot be.
  # Relative paths are relative to the working directory, which is right for a
  # checkout and wrong for a container: in a container name a path on a volume,
  # or the records go with the next release. Nothing here deletes a record —
  # one small file per meeting, pruned with `find -mtime +90 -delete` by
  # whoever wants them pruned.
  directory: sessions

  # THE MOST OF SOMEBODY ELSE'S DATA one meeting's record may carry, in bytes.
  #
  # Two things on a record belong to whoever is building on this server rather
  # than to this server: the room's metadata, as it stood when the meeting
  # began, and each participant's attributes, as they stood when that person
  # arrived. mediacore stores both and hands both back and reads neither — that
  # is where a platform puts its own idea of whose meeting this was, which
  # contract it is against, or whatever else it needs on the record afterwards.
  # The one thing this server does read out of room metadata is sessionPolicy,
  # and it reads it in the room service, long before a record exists.
  #
  # There is a limit because both arrive from outside: metadata over the room
  # service, attributes in a join token minted by somebody you do not control.
  # A value over the limit is dropped WHOLE — never truncated, because half a
  # JSON document is worse than none — and one warning names the meeting it
  # happened to. Sixteen kilobytes is far more than an identifier or two and
  # far less than anything that becomes a problem on a disk.
  max_opaque_bytes: 16384

  postgres:
    # A libpq connection string, or empty for no database at all. It carries a
    # password in every deployment that has one and is never logged: what the
    # server prints is the host, port and database it parsed out of it.
    #
    # THE DATABASE BEING DOWN DOES NOT STOP THIS SERVER. Not at startup and not
    # mid-call: nothing on the media path goes near this. What an outage costs
    # is the records held during it, which are kept in memory and written when
    # it comes back — watch unwritten_sessions= on /healthz, and
    # session_store=postgres:host:5432/db:down beside it.
    #
    # THE SCHEMA IS THIS SERVER'S TO CREATE. It applies whatever migrations the
    # database has not got on its first connection, under a lock the cluster
    # shares, so three nodes starting at once is safe and an upgrade is "start
    # the new binary". Every table is prefixed mediacore_, so this can be a
    # database something else also uses.
    #
    # TLS is not implemented: put the database on a trusted network — the same
    # cluster, which is where it belongs — and leave sslmode out of the url. A
    # url asking for sslmode=require is refused at startup rather than failing
    # obscurely at the first connection.
    url: ""

    # How many connections this node opens, which is also how many statements
    # it can have in flight. One thread each. Small on purpose: this server
    # asks very little of a database — a few statements per meeting, and a page
    # of history whenever somebody opens a backoffice.
    connections: 4

    # The cap on one connection attempt and on one statement. A query that has
    # wedged holds one of the connections above this long and no longer.
    timeout_ms: 10000

    # How long a meeting or an upload claim is believed without being renewed,
    # and so how quickly a dead node's work comes back to the others. A trade
    # in both directions: too long and a meeting that ended when a pod was
    # killed sits open until this elapses; too short and a node that is merely
    # busy has its meetings closed under it and its uploads taken away
    # mid-flight. Renewed three times per lease, so it has to be comfortably
    # more than timeout_ms — the server refuses to start if it is not at least
    # three times it.
    lease_ms: 30000

    # How many times one recording's upload or announcement is handed out
    # before it is left alone. Spent on the claim rather than on the result, so
    # a file whose upload kills whatever tries it is dropped after this many
    # nodes have died on it rather than going round the cluster for ever.
    attempts: 5

recording:
  # RECORD THE AUDIO, UPLOAD IT WHEN THE MEETING ENDS, ANNOUNCE THAT IT IS
  # THERE. Three steps, and this server stops there: what anybody does with the
  # announcement — transcribe it, bill for it, keep it for seven years — is
  # another service's business.
  #
  # NOTHING IS DECODED. The audio arrives as Opus with the sender's own
  # timestamps on it, is written into an Ogg container as Opus and uploaded as
  # Opus. No decoder, no encoder, no resampler, no mixing: the bytes in the
  # bucket are the bytes the browser produced. A recorder outside an SFU cannot
  # do this — an SDK hands a bot decoded audio and the bot has to re-encode it
  # — and we are the SFU.
  #
  # SILENCE IS KEPT. An Opus sender stops sending while nobody is talking, and
  # that is most of a meeting. The length of a recording here comes from the
  # sender's clock and not from the bytes written, so a participant who said
  # nothing for two minutes has two minutes MORE of recording, not two minutes
  # less — and a transcript aligned against it lands on the right second.
  #
  # This needs sessions.postgres.url: an upload is a row several processes
  # claim, and a directory of files cannot be a queue. The server refuses to
  # start otherwise rather than record for a week and upload nothing.

  # Record a room's meetings unless the room says otherwise. THIS IS A DEFAULT,
  # NOT A MASTER SWITCH: a room overrides it in its metadata with
  # {"sessionPolicy": {"record": true}}, so a deployment can record nothing by
  # default and one room by name, or the other way round.
  #
  # There is deliberately NO MINIMUM-PARTICIPANTS SETTING here. Whether a
  # meeting is happening is already decided once, by room.min_humans, which
  # goes down to one; recording follows the meeting and has no second threshold
  # of its own. A meeting room where everybody sits together and joins from one
  # account sets minHumans to 1 and is recorded like any other.
  enabled: false

  # Where the audio is written while a meeting is happening. Appending a page
  # to a local file is microseconds; a PUT to object storage can stall for
  # seconds and has no business near a live call, so nothing goes to the bucket
  # until a file is finished.
  #
  # ONE PROCESS PER DIRECTORY, exactly like sessions.directory: two sharing one
  # would each finish the other's live recordings at startup. It must be a
  # volume that outlives the container — a path inside the image is a path
  # whose contents go with the next release, and what would go with them is
  # every recording not yet uploaded.
  directory: recordings

  # How large one file may get before the recorder starts the next segment of
  # the same participant. A ceiling, not a target: Opus at the bitrate a
  # browser sends is a few megabytes an hour, so an ordinary meeting never
  # reaches this. What it bounds is the meeting nobody ever leaves and the
  # publisher sending far more than it should. Each segment is a whole file
  # with its own offset into the meeting, uploaded as one object.
  max_segment_mb: 256

  # How long a packet is held so that ones behind it can catch up. Not a jitter
  # buffer — nobody is listening to this in real time — just long enough to
  # undo an ordinary reordering. A packet that arrives after its place has gone
  # past is dropped, and the hole it leaves is exactly its own length. So is a
  # packet whose TIMESTAMP goes backwards: a granule position that decreases is
  # a malformed Ogg stream, and the row beside it would claim a length no
  # decoder agrees with.
  reorder_hold_ms: 100

  # How many packets may wait between the media path and the writer thread
  # before new ones are dropped rather than queued. The bound is why a disk
  # that has stopped costs audio and not meetings: without it a wedged
  # filesystem would grow this queue until the process was killed for memory,
  # and a server that is killed has dropped every call it was carrying. Watch
  # dropped_audio_packets= on /healthz.
  queue: 8192

  # How often this node asks for uploads and announcements to do, and how many
  # it takes at once — which is also how many uploads may be in flight.
  poll_interval_ms: 2000
  batch: 4

  # Keep the local file after the object store has it. Off, because a node's
  # disk is not a second copy anybody agreed to pay for: a server that keeps
  # every recording fills its volume and then stops recording, which is the
  # failure that costs meetings rather than bytes.
  keep_local: false

  s3:
    # The endpoint, scheme included. MinIO and Ceph answer on their own;
    # Amazon's is https://s3.<region>.amazonaws.com.
    endpoint: ""

    # The region the signature is scoped to. An object store with no regions
    # still wants one in the signature; anything consistent will do.
    region: us-east-1

    bucket: ""

    # The credentials, beside the api keys above. secret_access_key is never
    # logged: what a log line says about the object store is its endpoint and
    # its bucket.
    access_key_id: ""
    secret_access_key: ""

    # <endpoint>/<bucket>/<key> rather than <bucket>.<endpoint>/<key>. On,
    # because the deployments this is built for run their own object store and
    # both MinIO and Ceph want path style. Amazon's own S3 wants the other one
    # for buckets made since 2020: set this to false there.
    path_style: true

    # Put in front of every key, so one bucket can hold this server's
    # recordings beside something else's. A key is
    # <prefix>/<session id>/<participant sid>-<segment>.ogg, so an object can
    # be found from a database row and a row from an object without asking
    # anything in between.
    prefix: ""

    # How long one PUT of a whole recording may take. A TOTAL deadline, not an
    # idle one: the whole of a segment — up to max_segment_mb above — has to be
    # in the bucket inside this, or the upload fails and is retried
    # sessions.postgres.attempts times before the recording is given up on with
    # the audio still on this node's disk and nothing announced. The default
    # gives max_segment_mb a megabyte a second, which is the slowest link worth
    # calling a link, and the server refuses to start on a pairing that does not
    # clear even that.
    timeout_ms: 300000

events:
  # Who is told what happens, as it happens. Nothing here is on by default: with
  # no webhook endpoint and no broker there are no destinations, no outbox
  # directory is made and no task is started.
  #
  # An event is a notification that something changed and never the only copy of
  # it. Everything announced here is also written down -- the meeting under
  # sessions.directory, the room in ListRooms -- so a consumer that was down at
  # half past six can come back and ask what it missed, and a delivery that is
  # given up on costs a log line and a number on /healthz rather than a fact.
  #
  # Six event names. room_started, room_finished, participant_joined and
  # participant_left are LiveKit's, spelled as LiveKit spells them, with
  # LiveKit's payloads and LiveKit's signing. session_started and
  # session_finished are for the thing LiveKit has no concept of: a room is a
  # place and a session is the meeting that happened in it, and a room is made
  # long before its meeting starts.

  # The outbox. An event is written here before the first attempt is made and
  # struck off once every destination has taken it, so an endpoint that is away
  # for two minutes costs latency rather than two minutes of events -- and a
  # restart in the middle of that costs nothing. In a container this belongs on
  # a volume; docker-compose.yml mounts one.
  directory: events

  # How many events one destination may fall behind before the next one is
  # thrown away rather than queued. This bounds what an unreachable endpoint
  # costs in memory and how large the outbox can grow, because a record exists
  # exactly while an event is in a queue. Something thrown away is counted, said
  # in a log line, and reported to whoever eventually does hear from us as
  # numDropped, which is LiveKit's field for exactly this.
  queue: 10000

  # How many times one event is offered to one destination before this server
  # stops asking, how long an attempt may take, and the waits in between --
  # doubling from backoff_ms, capped at max_backoff_ms. Bounded on purpose: an
  # endpoint that has refused five times over half a minute will not take the
  # sixth, and a destination retrying for ever never reaches the event behind
  # the one it is stuck on.
  attempts: 5
  timeout_ms: 5000
  backoff_ms: 1000
  max_backoff_ms: 30000

  webhooks:
    # Every url gets every event, each with a queue and a worker of its own, so
    # a slow endpoint delays only itself. POSTed as
    # Content-Type: application/webhook+json with an Authorization: Bearer
    # holding a short-lived JWT whose sha256 claim is the digest of the body --
    # LiveKit's scheme exactly, so an existing LiveKit receiver takes these
    # unchanged.
    urls: []

    # Which of the keys above signs them. The receiver reads the key name out of
    # the token to know which secret to check it with, so this has to be a key
    # this server actually has -- and it refuses to start if it is not, rather
    # than signing everything with nothing and having it all rejected.
    api_key: ""

  kafka:
    # Needs a binary built with --features kafka; without it a broker named here
    # is refused at startup rather than quietly ignored. The body is the same
    # bytes the webhooks post, keyed by room name so one room's events share a
    # partition and stay in order.
    brokers: ""
    topic: mediacore

    # Passed to librdkafka unread: security.protocol, ssl.ca.location, sasl.*
    # and whatever else a broker wants.
    properties: {}

twirp:
  # The room API is mediacore.RoomService, so its own path is
  # /twirp/mediacore.RoomService/<Method>. LiveKit's server SDKs and lk do not
  # take a path: they build it in generated code from the package their own
  # .proto declares, which is livekit.RoomService. This also answers there.
  #
  # It is the same handler -- same methods, same grants, same error bodies --
  # so leaving it on costs nothing. Turning it off does not refuse those calls
  # politely: the route stops existing, and a LiveKit SDK gets a bare 404 with
  # no Twirp code in it and reports a transport failure. Turn it off when
  # nothing built against LiveKit calls this server any more.
  livekit_alias: true

rtc:
  udp_port: 7882
  port_range_start: 50000
  port_range_end: 60000
  bind_address: 0.0.0.0
  advertise_addresses: []
  use_socket_address: true
  use_external_ip: false
  node_ip: ""
  ice_disconnected_timeout: 20

video:
  dynacast_pause_delay_ms: 5000
  layer_upgrade_hold_ms: 2000

  # Bandwidth estimation, allocation and pacing, off by default. Turning it on
  # gives every subscriber transport str0m's congestion estimator and its leaky
  # bucket pacer, and gives the server a budget to spend across that
  # subscriber's video tracks. Publisher transports are never given either.
  bwe:
    enabled: false

    # What the estimator starts from before any feedback has arrived, and what
    # the allocator is allowed to spend over that same window, so a subscriber
    # joining a slow link is never handed everything. max_desired_kbps is the
    # ceiling on what the server ever asks the prober to aim for.
    initial_kbps: 600
    max_desired_kbps: 10000

    # A committed budget never falls below this. Below it there is no video
    # worth sending and the answer is to pause instead.
    min_budget_kbps: 150

    # Taken off the top for every audio subscription before video is allocated.
    # The floor matters: a track whose owner is silent measures near zero and
    # must still book the room it needs the moment they speak.
    audio_reserve_kbps: 48

    # false overruns the budget rather than blanking a subscriber's video,
    # which is also the reference's default. true lets the allocator pause the
    # lowest priority tracks instead, and the subscriber is told with
    # StreamStateUpdate when it does.
    allow_pause: false

    # How far past the budget allow_pause: false is allowed to go before it
    # pauses the lowest priority tracks anyway. Without a bound, refusing to
    # pause turns over-subscription into two seconds of pacer queue and leaves
    # the allocator with no move. The highest priority track always keeps its
    # base rung whatever this says.
    max_overrun_percent: 150

    # Bytes per packet added to a measured payload rate to price a layer as it
    # costs on the wire. Calibrated per subscriber at runtime from what str0m
    # reports; this is only the starting point.
    overhead_bytes: 40

    # How often the budget is spent across the tracks a subscriber receives.
    allocation_interval_ms: 250

    # Recovery is deliberately slower than reaction. A track is raised only
    # after the link has been clear for recovery_hold_ms, at most one track per
    # tick, and no track twice inside recovery_step_ms. Going down waits for
    # nothing.
    recovery_hold_ms: 2000
    recovery_step_ms: 1000

    # How long a packet may sit unsent in the pacer's queue before that counts
    # as congestion on its own. This is the signal that catches the failure
    # pacing introduces: over-subscription becomes latency, not loss.
    queue_pressure_ms: 150
