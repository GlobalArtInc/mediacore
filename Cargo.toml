[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/GlobalArtInc/mediacore"

[workspace.dependencies]
mediacore-auth = { path = "crates/auth" }
mediacore-client = { path = "crates/client" }
mediacore-config = { path = "crates/config" }
mediacore-proto = { path = "crates/proto" }
mediacore-room = { path = "crates/room" }
mediacore-sfu = { path = "crates/sfu" }
mediacore-transport = { path = "crates/transport" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
protox = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
str0m = { version = "0.23", default-features = false, features = ["rust-crypto"] }
thiserror = "2"
tokio-tungstenite = "0.29"
tower-http = { version = "0.7", features = ["cors", "set-header"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
