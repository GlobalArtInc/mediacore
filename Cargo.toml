[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/GlobalArtInc/mediacore"

[workspace.dependencies]
mediacore-auth = { path = "crates/auth" }
mediacore-client = { path = "crates/client" }
mediacore-config = { path = "crates/config" }
mediacore-events = { path = "crates/events" }
mediacore-proto = { path = "crates/proto" }
mediacore-recording = { path = "crates/recording" }
mediacore-room = { path = "crates/room" }
mediacore-session = { path = "crates/session" }
mediacore-sfu = { path = "crates/sfu" }
mediacore-transport = { path = "crates/transport" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hmac = "0.12"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
pbjson = "0.9"
postgres = "0.19"
pbjson-build = "0.9"
pbjson-types = "0.9"
prost = "0.14"
prost-build = "0.14"
prost-reflect = "0.16"
prost-types = "0.14"
protox = "0.9"
# Only ever compiled when `mediacore-events/kafka` is switched on, which is off
# by default: this links librdkafka into the binary and wants a C toolchain in
# whatever builds it, and an operator with no bus should pay for neither.
# default-features off drops the zstd and ssl bundles; a deployment that needs
# TLS to its broker gets it from librdkafka's own settings, which
# `events.kafka.properties` passes through.
rdkafka = { version = "0.39", default-features = false, features = ["libz", "tokio"] }
rand = "0.9"
# The two things in this workspace that open an outbound connection: the front
# end talking to an identity provider, and the SFU posting webhooks. Native
# roots rather than a bundled set,
# because an internal provider is very often signed by a CA that is in the
# machine's trust store and in no bundle; `system-proxy`, because a host that
# reaches the outside through one says so in the environment and nothing else
# here would read it.
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls-native-roots", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
# preserve_order, so a JSON object is written in the order it was built rather
# than alphabetically. It is the OpenAPI document at /swagger that needs it:
# `openapi`, `info` and `paths` belong at the top of a document somebody may
# read with `curl | head`, and the methods belong in the order the `.proto`
# declares them rather than sorted into a list where CreateRoom and DeleteRoom
# sit next to each other and ListRooms is somewhere else.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
# Only ever paired with `hmac`, and only to mint TURN credentials: coturn's
# shared-secret mode is draft-uberti-behave-turn-rest-00, which is fixed at
# HMAC-SHA1 and has no variant on anything newer. Nothing else in this
# workspace hashes with it.
sha1 = "0.10"
sha2 = "0.10"
str0m = { version = "0.23", default-features = false, features = ["rust-crypto"] }
tempfile = "3"
thiserror = "2"
tokio-tungstenite = "0.29"
tower-http = { version = "0.7", features = ["cors", "set-header"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
