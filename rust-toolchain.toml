# Pinned, not `stable`. With clippy run as `-D warnings`, a new stable turns a
# lint that did not exist yesterday into a red build on a commit that changed
# nothing near it -- and worse, a developer whose rustup is a version behind
# reports "clippy clean" for a build that will fail. Bump this deliberately.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
