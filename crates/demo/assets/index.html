<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mediacore demo</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main data-wide="false">
      <header class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">mediacore</span>
      </header>

      <section id="lobby" class="card">
        <h1>Join the room</h1>
        <p class="lede">
          Everyone in <code id="lobby-room">&hellip;</code> hears everyone else.
          Audio only unless you ask for the camera.
        </p>

        <form id="join-form" novalidate>
          <label for="name">Your name</label>
          <input
            id="name"
            name="name"
            type="text"
            maxlength="40"
            placeholder="Alice"
            autocomplete="off"
            autocapitalize="words"
            spellcheck="false"
            disabled
          />

          <label class="toggle" for="with-video">
            <input id="with-video" name="with-video" type="checkbox" disabled />
            <span>Publish my camera too, with simulcast</span>
          </label>

          <button id="join" type="submit" disabled>Join</button>
        </form>

        <p id="lobby-status" class="status" role="status">Loading the client&hellip;</p>
        <div id="lobby-error" class="alert" role="alert" hidden></div>
      </section>

      <section id="room" class="card" hidden>
        <div class="room-head">
          <div>
            <h1 id="room-name">&hellip;</h1>
            <p id="room-count" class="lede">&hellip;</p>
          </div>
          <span id="room-state" class="pill">connecting</span>
        </div>

        <dl id="link" class="link">
          <div>
            <dt>browser estimate in</dt>
            <dd id="link-estimate">&mdash;</dd>
          </div>
          <div>
            <dt>arriving now</dt>
            <dd id="link-arriving">&mdash;</dd>
          </div>
          <div>
            <dt>video arriving</dt>
            <dd id="link-video">&mdash;</dd>
          </div>
          <div>
            <dt>round trip</dt>
            <dd id="link-rtt">&mdash;</dd>
          </div>
          <div>
            <dt>browser estimate out</dt>
            <dd id="link-sending">&mdash;</dd>
          </div>
        </dl>

        <ul id="tiles" class="tiles" hidden></ul>

        <ul id="participants" class="participants"></ul>

        <button id="enable-audio" class="secondary" type="button" hidden>
          Enable audio playback
        </button>

        <div class="controls">
          <button id="camera" type="button" class="secondary">Start camera</button>
          <button id="mute" type="button" class="secondary">Mute</button>
          <button id="leave" type="button" class="ghost">Leave</button>
        </div>

        <div id="room-error" class="alert" role="alert" hidden></div>
      </section>

      <footer class="foot">
        <span id="foot-url"></span>
      </footer>
    </main>

    <div id="audio" class="sink" aria-hidden="true"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
