name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest

    # The session store's queue -- two nodes reaching for the same recording,
    # and what becomes of one whose claimant died -- is tested against a real
    # server or it is not tested at all: `FOR UPDATE SKIP LOCKED` is the thing
    # under test and a mock of it proves nothing. `crates/session/tests/postgres.rs`
    # makes a database per test against this and drops it afterwards, and it
    # fails the build if this service is missing rather than skipping quietly.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mediacore
          POSTGRES_PASSWORD: mediacore
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mediacore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        env:
          MEDIACORE_TEST_POSTGRES: postgres://mediacore:mediacore@127.0.0.1:5432/postgres
        run: cargo test --workspace
